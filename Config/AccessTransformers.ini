[AccessTransformers]
; Let the hook class reach the protected/private hologram internals it needs
; (mSplineData, mSplineComponent, UpdateSplineComponent, the max-length fields,
; the end-pole child holograms, and the protected CheckValidPlacement we hook).
; Friend and Accessor transformers need a C++ rebuild to take effect.
; If the header generator does not pick up a change, add/remove a ';' comment line
; here to bump the file's modification time.
Friend=(Class="AFGHologram", FriendClass="FSegmentedSplinesHooks")
Friend=(Class="AFGSplineHologram", FriendClass="FSegmentedSplinesHooks")
Friend=(Class="AFGConveyorBeltHologram", FriendClass="FSegmentedSplinesHooks")
Friend=(Class="AFGRailroadTrackHologram", FriendClass="FSegmentedSplinesHooks")
Friend=(Class="AFGPipelineHologram", FriendClass="FSegmentedSplinesHooks")
